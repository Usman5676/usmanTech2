<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finite Automata Checker</title>
  <style>
    /* Reset default margins */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    display: flex;
    align-items: center;
    height: 100vh;
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d532);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
}

@keyframes gradient {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}
  
  /* Wrapper */
  .wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
  }
  
  /* Card */
  .card {
    background: white;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
  }
  
  /* Heading */
  h1 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 24px;
    color: #333;
  }
  
  /* Form */
  form {
    display: flex;
    flex-direction: column;
  }
  
  /* Form group */
  .form-group {
    margin-bottom: 20px;
  }
  
  label {
    margin-bottom: 8px;
    display: block;
    font-weight: bold;
    color: #555;
  }
  
  input[type="text"] {
    width: 100%;
    padding: 10px 14px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    transition: 0.3s;
  }
  
  input[type="text"]:focus {
    border-color: #0ec5e6;
    outline: none;
  }
  
  @keyframes colorCycle {
  0%   { background-color: #3498db; }  /* Blue */
  25%  { background-color: #2ecc71; }  /* Green */
  50%  { background-color: #f1c40f; }  /* Yellow */
  75%  { background-color: #e67e22; }  /* Orange */
  100% { background-color: #e74c3c; }  /* Red */
}
  /* Button */
  .btn {
    padding: 12px;
    font-size: 16px;
    background-color: #00d4fa;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
  
  }

  
  .btn:hover {
    background-color: #0ec5e6;
    animation: colorCycle 5s infinite linear
  }
  
  /* Result */
  .result {
    margin-top: 25px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    padding: 15px;
    border-radius: 8px;
  }
  
  /* Success */
  .result.success {
    background-color: #d4edda;
    color: #155724;
  }
  
  /* Error */
  .result.error {
    background-color: #f8d7da;
    color: #721c24;
  }
  
  /* Warning */
  .result.warning {
    background-color: #fff3cd;
    color: #856404;
  }
  
  </style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <h1>Finite Automata Checker</h1>

    <form id="faForm">
      <div class="form-group">
        <label for="regexInput">Regular Expression (RE):</label>
        <input type="text" id="regexInput" placeholder="e.g., (a+b)*" required>
      </div>

      <div class="form-group">
        <label for="stringInput">String to Test:</label>
        <input type="text" id="stringInput" placeholder="e.g., abba" required>
      </div>

      <button type="submit" class="btn">Check String</button>
    </form>

    <div id="result" class="result"></div>
  </div>
</div>

<script>
  document.getElementById('faForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Prevent page reload
  
    const regexInput = document.getElementById('regexInput').value.trim();
    const stringInput = document.getElementById('stringInput').value.trim();
    const resultDiv = document.getElementById('result');
  
    // Convert (a+b) into (a|b)
    let convertedRE = regexInput.replace(/\+/g, '|');
  
    try {
      const regex = new RegExp(`^${convertedRE}$`);
      
      if (regex.test(stringInput)) {
        resultDiv.textContent = "✅ String belongs to the Regular Expression!";
        resultDiv.className = "result success";
      } else {
        resultDiv.textContent = "❌ String does NOT belong to the Regular Expression.";
        resultDiv.className = "result error";
      }
    } catch (error) {
      resultDiv.textContent = "⚠️ Invalid Regular Expression syntax.";
      resultDiv.className = "result warning";
    }
  });
  
</script>

</body>
</html>
